[pytest]
# tests/ imports config, ingest and rag_pipeline directly, so the project
# root has to be importable. Previously this only worked by accident,
# depending on which directory pytest happened to be invoked from.
pythonpath = .

testpaths = tests

# check_threshold.py is a diagnostic script, not a test. It used to sit in
# tests/ and ran at import time, which meant collection alone loaded the
# embedding model and printed to stdout. It now lives in scripts/.
python_files = test_*.py

markers =
    integration: hits the live Groq API; needs GROQ_API_KEY. Excluded by default.
    retrieval: needs a built vector store (embedding model download on a cold CI run).

# Integration tests are opt-in. Run everything with:
#   pytest -m ""
# Run only the live-API tests with:
#   pytest -m integration
addopts =
    -ra
    --strict-markers
    -m "not integration"
