name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

# A new push to the same branch cancels the previous run instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ubuntu-latest

    # The embedding model download plus the index build can be slow on a cold
    # cache. Without a limit a hung run burns the full 6-hour default.
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Caches the pip download directory keyed on requirements.txt.
          # torch and sentence-transformers are large; this is the single
          # biggest saving available here.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # HuggingFace re-downloads the embedding model on every run otherwise.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
          restore-keys: |
            hf-${{ runner.os }}-

      # chroma_db/ is gitignored, so CI starts with no index. Building it as
      # an explicit step means a broken knowledge base fails here with a
      # readable error, instead of surfacing as every retrieval test failing
      # for no obvious reason.
      - name: Build the vector store
        run: python ingest.py

      - name: Verify the index is usable
        run: |
          python - <<'PY'
          from ingest import index_status
          ready, reason = index_status()
          print(f"index: {reason}")
          raise SystemExit(0 if ready else 1)
          PY

      # Integration tests are excluded by pytest.ini's addopts. They call the
      # live Groq API, and GitHub does not expose secrets to workflows
      # triggered by pull requests from forks - so on a fork PR the old
      # workflow failed on an empty API key, not on a real defect.
      - name: Run tests
        run: pytest -v

  integration:

    # Only runs where secrets are actually available: pushes to main and PRs
    # from branches in this repository.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Build the vector store
        run: python ingest.py

      # conftest.py skips these when the key is absent, so a missing or
      # expired secret degrades to "skipped" rather than a red build.
      - name: Run integration tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest -v -m integration
